<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temp Dash</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 20px;
            background-color: #121212;
            
        }
        h1,
        h2{
            color: #af4343;
            
        }
        h1::before {
            content: "";
            display: inline-block;
            width: 2px;
            height: 1em;
            background-color: #af4343;
            margin-right: 10px;
            vertical-align: top
        }
        p {
            line-height: 1.6;
            color: #555;
        }
        hr {
            border: none;
            height: 1px;
            background-color: #af4343;
            margin: 20px 0;
        }
        hr.stripd {
            background:repeating-linear-gradient(
                to right,
                #af4343,
                #af4343 10px,
                transparent 10px,
                transparent 20px
                
            );


        }
        .loader {
        width: 120px;
        height: 20px;
        -webkit-mask:linear-gradient(#000 70%,#0000 0) 0/25%;
        background:
        linear-gradient(#000000 0 0) 0/0% no-repeat
        #ddd;
        animation: l4 4s infinite steps(100);
        }
        @keyframes l4 {
            100% {background-size:120%}
        }
    </style>
</head>
<body>
    <h1>TempDash</h1>
    <hr class="stripd">
    <p>The most important changes in Temperatur, Humidity and Air Pressure of your home are shown here</p>
    <h2>Current stats:</h2>
    <h2>{temp}</h2>
    <h2>{humi}</h2>
    <h2>{press}</h2>
    <canvas id="tempChart" width="600" height="250"></canvas>

    <script>
        const ctx = document.getElementById('tempChart');

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: [timeList],
                datasets: [{
                    label: 'Temperature (°C)',
                    data: [tempList],
                    borderColor: 'rgb(255, 99, 132)',
                    backgroundColor: 'rgba(255, 99, 132, 0.2)',
                    tension: 0.2,
                    fill: true,
                    yAxisID: 'y-temp',
                },
                {
                    label: 'Humidity (%)',
                    data: [pressureList],
                    borderColor: 'rgb(54, 162, 235)',
                    backgroundColor: 'rgba(54, 162, 235, 0.2)',
                    tension: 0.2,
                    fill: true,
                    yAxisID:'y-pressure'
                },
                {
                        label: 'Air Pressure (hPa)',
                        data: [humidityList],
                        borderColor: 'rgb(75, 192, 192)',
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        yAxisID: 'y-humidity',
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        position: 'top',
                    },
                    title: {
                        display: true,
                        text: 'Temperature Over Time'
                    }
                },
                scales: {
                    'y-temp': {
                        type: 'linear',
                        position: 'left',
                        title: { display: true, text: 'Temperatur (°C)' }
                    },
                    'y-humidity': {
                        type: 'linear',
                        position: 'right',
                        title: { display: true, text: 'Luftfeuchtigkeit (%)' },
                        grid: { drawOnChartArea: false } // Verhindert überlappende Gitterlinien
                    },
                    'y-pressure': {
                        type: 'linear',
                        position: 'right',
                        title: { display: true, text: 'Luftdruck (hPa)' },
                        grid: { drawOnChartArea: false }
                    }
                }
            }
        });
    </script>

</body>
</html>
